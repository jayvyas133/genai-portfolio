name: ai-portfolio

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aicore}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF (append-only file): Deep Research keeps its job queue here, so
    # queued jobs must survive a Redis restart (fsync every second).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Langfuse v2 (Postgres-only). v3 additionally needs ClickHouse + S3/MinIO.
  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me}
      SALT: ${LANGFUSE_SALT:-change-me}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

  # DocuMind HTTP API (projects/01-documind). Model keys come from ../.env.
  documind-api:
    build:
      context: ..
      dockerfile: projects/01-documind/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      # Inside the compose network Postgres is "postgres", not localhost.
      DOCUMIND_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/documind
    ports:
      - "8000:8000"

  # Deep Research (projects/02-deep-research): the API queues jobs in
  # Redis, the worker runs them. `docker compose up deep-research-worker`
  # starts Redis, the API and the worker.
  deep-research-api:
    build:
      context: ..
      dockerfile: projects/02-deep-research/Dockerfile
    image: ai-portfolio/deep-research
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DEEP_RESEARCH_REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"

  deep-research-worker:
    image: ai-portfolio/deep-research
    command: ["deep-research", "worker"]
    depends_on:
      redis:
        condition: service_healthy
      deep-research-api:
        condition: service_started
    env_file:
      - path: ../.env
        required: false
    environment:
      DEEP_RESEARCH_REDIS_URL: redis://redis:6379/0
      # Ollama runs on the host, not in the compose network.
      AICORE_OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # A crashed worker is restarted; its unfinished job is reclaimed from Redis.
    restart: unless-stopped

  # Text-to-SQL chat API (projects/03-text-to-sql-agent).
  # `docker compose up text-to-sql-api` runs the one-shot init job first
  # (Chinook + read-only role, memory database + checkpoint tables), then
  # the API. Each database URL uses its own role.
  text-to-sql-init:
    build:
      context: ..
      dockerfile: projects/03-text-to-sql-agent/Dockerfile
    image: ai-portfolio/text-to-sql
    command: ["sh", "-c", "text-to-sql load-db && text-to-sql init-memory"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEXT_TO_SQL_ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      TEXT_TO_SQL_DATABASE_URL: postgresql://sql_agent_ro:${TEXT_TO_SQL_RO_PASSWORD:-sql_agent_ro}@postgres:5432/chinook
      TEXT_TO_SQL_MEMORY_DATABASE_URL: postgresql://sql_agent_app:${TEXT_TO_SQL_APP_PASSWORD:-sql_agent_app}@postgres:5432/text_to_sql_memory

  text-to-sql-api:
    image: ai-portfolio/text-to-sql
    depends_on:
      text-to-sql-init:
        condition: service_completed_successfully
    env_file:
      - path: ../.env
        required: false
    environment:
      # Only the two agent roles; the admin URL stays in the init job.
      TEXT_TO_SQL_DATABASE_URL: postgresql://sql_agent_ro:${TEXT_TO_SQL_RO_PASSWORD:-sql_agent_ro}@postgres:5432/chinook
      TEXT_TO_SQL_MEMORY_DATABASE_URL: postgresql://sql_agent_app:${TEXT_TO_SQL_APP_PASSWORD:-sql_agent_app}@postgres:5432/text_to_sql_memory
      # Ollama runs on the host, not in the compose network.
      AICORE_OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8000"
    restart: unless-stopped

  # One URL for all three projects: the plain page (/), the React page
  # (/react/) and a reverse proxy to the three APIs (ADR 0021).
  # `docker compose up web` starts every API and its dependencies.
  web:
    build:
      context: ../web
    image: ai-portfolio/web
    depends_on:
      - documind-api
      - deep-research-api
      - deep-research-worker
      - text-to-sql-api
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
