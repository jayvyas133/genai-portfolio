[project]
name = "aicore"
version = "0.1.0"
description = "Shared platform layer for the AI portfolio projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=8.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicore"]
