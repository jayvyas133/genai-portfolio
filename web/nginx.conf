# One URL for the whole portfolio: the static page plus a reverse proxy
# to the three APIs. The browser only ever talks to this origin, so no
# API needs CORS (Cross-Origin Resource Sharing) settings (ADR 0021).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Questions are small; the APIs enforce their own, tighter limits.
    client_max_body_size 64k;

    location / {
        try_files $uri $uri/ =404;
    }

    # DocuMind (Flask): POST /ask answers within its own 30 s limit.
    location /api/documind/ {
        proxy_pass http://documind-api:8000/;
        proxy_read_timeout 60s;
    }

    # Deep Research (FastAPI): jobs plus a live SSE (Server-Sent Events)
    # stream. Buffering off so each progress event reaches the browser at
    # once; the API sends a heartbeat, so 1 h only ends a dead stream.
    location /api/research/ {
        proxy_pass http://deep-research-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Text-to-SQL (Flask): a turn can take up to its 120 s limit.
    location /api/sql/ {
        proxy_pass http://text-to-sql-api:8000/;
        proxy_read_timeout 180s;
    }
}
