[project]
name = "deep-research"
version = "0.1.0"
description = "Multi-agent deep research service (FastAPI + LangGraph)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aicore",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langgraph>=0.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
deep-research = "deep_research.cli:main"

[tool.uv.sources]
aicore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research"]
