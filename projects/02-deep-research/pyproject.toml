[project]
name = "deep-research"
version = "0.1.0"
description = "Multi-agent deep research service (FastAPI + LangGraph)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aicore",
    "fastapi>=0.115",
    "langgraph>=0.2",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
aicore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research"]
