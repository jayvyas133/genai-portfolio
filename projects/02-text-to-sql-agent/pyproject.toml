[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Text-to-SQL agent (Flask + LangGraph)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aicore",
    "flask>=3.0",
    "langgraph>=0.2",
]

[tool.uv.sources]
aicore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_sql_agent"]
