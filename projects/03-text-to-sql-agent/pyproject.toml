[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Conversational Text-to-SQL chatbot (Flask + LangGraph)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aicore",
    "flask>=3.0",
    "gunicorn>=23.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlglot>=30",
]

[project.scripts]
text-to-sql = "text_to_sql_agent.cli:main"

[tool.uv.sources]
aicore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_sql_agent"]
