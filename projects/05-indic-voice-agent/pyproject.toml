[project]
name = "indic-voice-agent"
version = "0.1.0"
description = "Indic-language voice agent (FastAPI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aicore",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
aicore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indic_voice_agent"]
