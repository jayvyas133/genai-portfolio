[project]
name = "documind"
version = "0.1.0"
description = "DocuMind: question answering over documents with cited sources (Flask)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aicore",
    "flask>=3.0",
]

[tool.uv.sources]
aicore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documind"]
