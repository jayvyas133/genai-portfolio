[project]
name = "documind"
version = "0.1.0"
description = "DocuMind: question answering over documents with cited sources (Flask)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aicore",
    "flask>=3.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.scripts]
documind = "documind.cli:main"

[tool.uv.sources]
aicore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documind"]
